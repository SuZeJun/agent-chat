name: agent-chat

x-backend-build: &backend-build
  context: .
  dockerfile: Dockerfile

x-backend-environment: &backend-environment
  APP_ENV: development
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgres://agent_chat:agent_chat_password@postgres:5432/agent_chat?sslmode=disable
  DATABASE_MAX_OPEN_CONNS: ${DATABASE_MAX_OPEN_CONNS:-10}
  DATABASE_MIN_OPEN_CONNS: ${DATABASE_MIN_OPEN_CONNS:-1}
  DATABASE_PING_TIMEOUT: ${DATABASE_PING_TIMEOUT:-2s}
  DATABASE_MIGRATION_TIMEOUT: ${DATABASE_MIGRATION_TIMEOUT:-30s}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
  LLM_MODEL: ${LLM_MODEL:-deepseek-v4-flash}
  LLM_THINKING: ${LLM_THINKING:-false}
  LLM_TIMEOUT: ${LLM_TIMEOUT:-60s}
  EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
  EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://open.bigmodel.cn/api/paas/v4}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-embedding-3}
  EMBEDDING_DIM: ${EMBEDDING_DIM:-1024}
  EMBEDDING_TIMEOUT: ${EMBEDDING_TIMEOUT:-30s}
  WORKER_POLL_INTERVAL: ${WORKER_POLL_INTERVAL:-2s}
  WORKER_JOB_TIMEOUT: ${WORKER_JOB_TIMEOUT:-2m}
  WORKER_LOCK_TIMEOUT: ${WORKER_LOCK_TIMEOUT:-5m}
  WORKER_RETRY_BASE_DELAY: ${WORKER_RETRY_BASE_DELAY:-2s}
  WORKER_RETRY_MAX_DELAY: ${WORKER_RETRY_MAX_DELAY:-1m}

services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: agent_chat
      POSTGRES_USER: agent_chat
      POSTGRES_PASSWORD: agent_chat_password
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_chat -d agent_chat"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  api:
    build: *backend-build
    restart: unless-stopped
    environment:
      <<: *backend-environment
      HTTP_ADDR: :8080
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  worker:
    build: *backend-build
    command: ["/app/worker"]
    restart: unless-stopped
    environment:
      <<: *backend-environment
      WORKER_ID: ${WORKER_ID:-compose-worker}
    depends_on:
      postgres:
        condition: service_healthy

  demo-seed:
    image: python:3.13.7-alpine
    restart: "no"
    environment:
      API_BASE_URL: http://api:8080
      DEMO_ADMIN_ID: ${DEMO_ADMIN_ID:-demo-admin}
      DEMO_KNOWLEDGE_BASE_NAME: ${KNOWLEDGE_BASE_NAME:-Agent Chat SaaS 演示知识库}
      DEMO_FAQ_PATH: /demo/saas-api-faq.csv
    volumes:
      - ./demo:/demo:ro
    command: ["python", "/demo/seed.py"]
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: web
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      API_BASE_URL: http://api:8080
      DEMO_CUSTOMER_ID: ${DEMO_CUSTOMER_ID:-demo-customer}
      DEMO_AGENT_ID: ${DEMO_AGENT_ID:-demo-agent}
      DEMO_ADMIN_ID: ${DEMO_ADMIN_ID:-demo-admin}
      KNOWLEDGE_BASE_ID: ${KNOWLEDGE_BASE_ID:-}
      KNOWLEDGE_BASE_NAME: ${KNOWLEDGE_BASE_NAME:-Agent Chat SaaS 演示知识库}
    depends_on:
      api:
        condition: service_healthy
      demo-seed:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  postgres-data:

name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg17-bookworm
        env:
          POSTGRES_DB: agent_chat_test
          POSTGRES_USER: agent_chat
          POSTGRES_PASSWORD: agent_chat_password
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U agent_chat -d agent_chat_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Check formatting
        shell: bash
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi

      - name: Test
        run: go test ./...

      - name: Integration test
        env:
          TEST_DATABASE_URL: postgres://agent_chat:agent_chat_password@127.0.0.1:5433/agent_chat_test?sslmode=disable
        run: go test -count=1 ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: |
          go build ./cmd/api
          go build ./cmd/worker

      - name: Validate Compose
        run: docker compose config --quiet

name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg17-bookworm
        env:
          POSTGRES_DB: agent_chat_test
          POSTGRES_USER: agent_chat
          POSTGRES_PASSWORD: agent_chat_password
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U agent_chat -d agent_chat_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: evals/requirements.txt

      - name: Install Eval dependencies
        run: python -m pip install -r evals/requirements.txt

      - name: Download dependencies
        run: go mod download

      - name: Check formatting
        shell: bash
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi

      - name: Test
        run: go test ./...

      - name: Integration test
        env:
          TEST_DATABASE_URL: postgres://agent_chat:agent_chat_password@127.0.0.1:5433/agent_chat_test?sslmode=disable
        run: go test -count=1 ./...

      - name: Run MVP release Eval
        run: python -m pytest evals/runner

      - name: Test demo seed
        run: |
          python -m unittest discover -s demo -p "test_*.py"
          python -m unittest discover -s scripts -p "test_*.py"

      - name: Vet
        run: go vet ./...

      - name: Build
        run: |
          go build ./cmd/api
          go build ./cmd/worker

      - name: Validate Compose
        run: docker compose config --quiet

      - name: Build deployment images
        run: docker compose build api web

      # 真机起栈校验一键部署：postgres -> api 健康 -> demo-seed 跑完 -> web 健康。
      # CI 的 postgres service 已占用宿主 5433，这里改用 5434 避免端口冲突。
      - name: Start deployment stack
        env:
          POSTGRES_PORT: 5434
        run: docker compose up -d --wait --wait-timeout 240 web worker

      # web 声明了 depends_on demo-seed: service_completed_successfully，
      # 因此上一步起栈成功已经证明 seed 退出码为 0，这里只做对外可达性校验。
      - name: Verify deployment stack
        env:
          POSTGRES_PORT: 5434
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8080/readyz
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:3000/
          docker compose ps
          docker compose logs --no-color demo-seed

      - name: Dump deployment stack logs
        if: failure()
        env:
          POSTGRES_PORT: 5434
        run: docker compose logs --no-color --tail 200

      - name: Stop deployment stack
        if: always()
        env:
          POSTGRES_PORT: 5434
        run: docker compose down -v --remove-orphans

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # 构建不依赖运行时配置：页面是 force-dynamic，配置在请求时才读取。
      - name: Build
        run: npm run build
